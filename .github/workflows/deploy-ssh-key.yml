name: Deploy to cPanel via SSH Key

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and Build
        run: |
          npm install
          npm run generate

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Add SSH key if provided
          if [ -n "${{ secrets.CPANEL_SSH_KEY }}" ]; then
            echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          fi

          # Configure SSH
          cat > ~/.ssh/config << EOF
          Host cpanel
            HostName ${{ secrets.CPANEL_HOST }}
            User ${{ secrets.CPANEL_USERNAME }}
            Port ${{ secrets.CPANEL_SSH_PORT }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection..."
          ssh cpanel "pwd && ls -la" || echo "SSH test failed - check your credentials"

      - name: Clean remote directory
        run: |
          ssh cpanel "rm -rf ${{ secrets.CPANEL_PUBLIC_PATH }}/*"

      - name: Deploy via SCP
        run: |
          scp -r .output/public/* cpanel:${{ secrets.CPANEL_PUBLIC_PATH }}/
